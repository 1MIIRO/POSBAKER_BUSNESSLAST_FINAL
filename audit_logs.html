<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        padding: 20px;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    /* Scrollable table container */
    .table-container {
        max-height: 500px; /* adjust as needed */
        overflow-y: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    table.audit-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed; /* fixed layout for column widths */
        word-wrap: break-word;
    }

    table.audit-table th, table.audit-table td {
        padding: 12px 15px;
        text-align: left;
        border: 1px solid #ddd;
        vertical-align: top; /* allows rows to expand */
        white-space: normal; /* allow multi-line content */
    }

    /* COLUMN WIDTHS */
    table.audit-table th:nth-child(1) { width: 12%; } /* Audit ref */
    table.audit-table th:nth-child(2) { width: 18%; } /* Description */
    table.audit-table th:nth-child(3) { width: 25%; } /* Action widest */
    table.audit-table th:nth-child(4) { width: 15%; } /* Date */
    table.audit-table th:nth-child(5) { width: 15%; } /* Time */
    table.audit-table th:nth-child(6) { width: 15%; } /* Done by */

    /* HEADER STYLES */
    table.audit-table th:nth-child(1) { color: black; background-color: green; position: sticky; top: 0; z-index: 2; }
    table.audit-table th:nth-child(2),
    table.audit-table th:nth-child(3),
    table.audit-table th:nth-child(4),
    table.audit-table th:nth-child(5) { color: purple; background-color: yellow; position: sticky; top: 0; z-index: 2; }
    table.audit-table th:nth-child(6) { color: red; background-color: green; position: sticky; top: 0; z-index: 2; }

    /* Hover effect */
    table.audit-table tr:hover { background-color: #f1f1f1; }

   
/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    top: 0;
    left: 0;

    background: #222;

    overflow-x: hidden;
    overflow-y: auto;

    padding-top: 20px;

    transition: width 0.3s ease;

    color: white;

    z-index: 2000;

    display: flex;
    flex-direction: column;
}

.sidebar.active {
    width: 170px;
}


/* SIDEBAR LINKS */

.sidebar a {
    display: block;

    padding: 10px 0;

    color: #ddd;

    text-decoration: none;

    white-space: nowrap;
}

.sidebar a:hover {
    color: white;
}


/* SIDEBAR USER INFORMATION */

.sidebar h5 {
    color: white;
    white-space: nowrap;
}

.sidebar p {
    color: #aaa;
    white-space: nowrap;
}


/* =========================================================
   SIDEBAR FOOTER
   ========================================================= */

.sidebar-footer {
    margin-top: auto;
    padding: 15px;
}

.logout-btn {
    display: block;

    width: 100%;

    box-sizing: border-box;

    background: #ffffff;

    color: #dc3545 !important;

    text-align: center;

    text-decoration: none;

    padding: 12px;

    border-radius: 8px;

    font-weight: 700;

    border: none;
}

.logout-btn:hover {
    background: #fff5f5;

    color: #dc3545 !important;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.top-bar {
    display: flex;

    align-items: center;

    width: 100%;

    min-height: 50px;

    transition:
        margin-left 0.3s ease,
        width 0.3s ease;
}


/* =========================================================
   MENU ICON
   ========================================================= */

.menu-icon {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 28px;

    color: #222;

    transition:
        margin-left 0.3s ease;
}

 
/* TOP BAR */
.top-bar {
    width: 100%;
    background: #ffffff;
    padding: 10px;
    color: #000000;
    font-weight: bold;
}

/* DATE AND TIME NUMBERS */
#dateText,
#timeText {
    color: #000000;
}


/* =========================================================
   DATE / TIME
   ========================================================= */

.top-bar-item {
    transition:
        margin-left 0.3s ease;
}

.date-box,
.time-box {
    display: flex;

    align-items: center;

    gap: 8px;
}

.icon-button {
    border: none;

    background: transparent;

    padding: 0;

    cursor: pointer;
}

.icon-img {
    width: 30px;
    height: 30px;

    object-fit: cover;

    border-radius: 4px;
}


/* =========================================================
   SIDEBAR SHIFT
   ========================================================= */

body {
    overflow-x: hidden;
}


/*
   Your Dashboard uses 250px for the left-side shift.
   This makes the Audit Logs page follow that same movement.
*/

body.sidebar-shifted .top-bar {
    margin-left: 250px;

    width: calc(100% - 250px);
}

body.sidebar-shifted h2 {
    margin-left: 250px;
}

body.sidebar-shifted .table-container {
    margin-left: 250px;

    width: calc(100% - 250px);
}


/* =========================================================
   SMOOTH MOVEMENT
   ========================================================= */

h2 {
    transition:
        margin-left 0.3s ease;
}

.table-container {
    transition:
        margin-left 0.3s ease,
        width 0.3s ease;
}


body.sidebar-shifted .menu-icon {
    margin-left: 0;
}


/* TOP BAR */
.top-bar {
    width: 100%;
    background: #edeff0;
    padding: 10px;
    color: white;
    font-weight: bold;
}

.menu-icon {
    font-size: 26px;
    cursor: pointer;
    color: blue;  /* Make hamburger icon blue */
}



</style>
</head>
    <body>

            <div id="sidebar" class="sidebar">
                <div class="p-3">
                    <h5>{{ user.personal_name }}</h5>
                    <p>{{ user.job_desc }}</p>
                </div>

                <ul class="list-unstyled ps-3">
                    <li><a href="{{ url_for('dashboard') }}">Point_of_sales</a></li>
                    <li><a href="{{ url_for('activity_billing_queue') }}">Activity</a></li>
                    <li><a href="{{ url_for('audit_logs') }}">Audit logs</a></li>
                    <li><a href="{{ url_for('product_inventory') }}">Inventory</a></li>
                    <li><a href="{{ url_for('admin_employee') }}">Admin Employees</a></li>
                    <li><a href="#" id="userProfileButton">User Profile</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>

                <div class="sidebar-footer">
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
            </div>

        <!-- TOP BAR -->
            <div class="top-bar d-flex align-items-center">
                <div id="menuToggle" class="menu-icon">&#9776;</div>
                <div class="date-box ms-3 top-bar-item">
                <button class="icon-button">
                        <img src="{{ url_for('static', filename='images/calendar_icon.jpg') }}" 
                            alt="date_icon" 
                            class="icon-img">
                </button>
                <span id="dateText">--/--/----</span>
                </div>

                <div class="time-box ms-3 top-bar-item">
                    <button class="icon-button">
                        <img src="{{ url_for('static', filename='images/clock_icon.jpg') }}" 
                            alt="date_icon" 
                            class="icon-img">
                </button>
                    <span id="timeText">--:--:--</span>
                </div>
            
            </div>

            <h2>Audit Logs</h2>

            <div class="table-container">
                <table class="audit-table" id="auditTable">
                    <thead>
                        <tr>
                            <th>Audit reference number</th>
                            <th>Description</th>
                            <th>Action</th>
                            <th>Date</th>
                            <th>TIME</th>
                            <th>Done by</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Initially empty -->
                    </tbody>
                </table>
            </div>

            <script>
                const auditTableBody = document.querySelector('#auditTable tbody');

                /**
                 * Adds a new row to the audit table.
                 * Rows expand dynamically if content is long.
                 */
                function addAuditRow(refNum, description, action, date, time, doneBy) {
                    const row = document.createElement('tr');

                    [refNum, description, action, date, time, doneBy].forEach(val => {
                        const td = document.createElement('td');
                        td.textContent = val || '';
                        row.appendChild(td);
                    });

                    auditTableBody.appendChild(row);
                }

                /**
                 * Clears the table body
                 */
                function clearTable() {
                    auditTableBody.innerHTML = '';
                }

                /**
                 * Adds a row to the table
                 */
                function addAuditRow(refNum, description, action, date, time, doneBy) {
                    const row = document.createElement('tr');
                    [refNum, description, action, date, time, doneBy].forEach(val => {
                        const td = document.createElement('td');
                        td.textContent = val || '';
                        row.appendChild(td);
                    });
                    auditTableBody.appendChild(row);
                }

                /**
                 * Fetch data from backend API and populate table
                 */
                async function fetchAuditLogs() {
                    try {
                        const response = await fetch('get_audit_logs');
                        const data = await response.json();

                        clearTable(); // clear existing rows

                        data.forEach(item => {
                            addAuditRow(
                                item.audit_reference_number,
                                item.description,
                                item.action,
                                item.audit_date,
                                item.audit_time,
                                item.done_by
                            );
                        });
                    } catch (err) {
                        console.error('Error fetching audit logs:', err);
                    }
                }

                // Fetch immediately
                fetchAuditLogs();

                // Refresh table every 5 seconds
                setInterval(fetchAuditLogs, 5000);

                    
      
// =========================================================
// SIDEBAR ELEMENTS
// =========================================================

const sidebar = document.getElementById('sidebar');
const menuToggle = document.getElementById('menuToggle');


// =========================================================
// SIDEBAR SHIFT FUNCTION
// =========================================================

function shiftUI(shiftSidebar) {

    if (shiftSidebar) {

        document.body.classList.add('sidebar-shifted');

    } else {

        document.body.classList.remove('sidebar-shifted');

    }
}


// =========================================================
// MENU TOGGLE
// =========================================================

menuToggle.addEventListener('click', function () {

    sidebar.classList.toggle('active');

    const sidebarIsOpen =
        sidebar.classList.contains('active');

    shiftUI(sidebarIsOpen);

});


// =========================================================
// CLOSE SIDEBAR WHEN CLICKING INSIDE SIDEBAR
// =========================================================

sidebar.addEventListener('click', function () {

    sidebar.classList.remove('active');

    shiftUI(false);

});

  function updateDateTime() {
            const now = new Date();
            document.getElementById('dateText').textContent = now.toLocaleDateString();
            document.getElementById('timeText').textContent = now.toLocaleTimeString();
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();









            </script>

    </body>
</html>
